# this workflow checks if the style file compiles using tectonic
name: Compile Check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TECTONIC_CACHE_DIR: ${{ runner.temp }}/tectonic-cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: true
          use-flakehub: false

      - name: Install ci tools
        run: nix profile add .#ci

      - name: Cache Tectonic resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TECTONIC_CACHE_DIR }}
          key: ${{ runner.os }}-tectonic-v1-${{ hashFiles('flake.lock', '*.tex', '*.sty') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-v1-

      # xelatex (tectonic)
      - name: check tectonic (xelatex)
        run: tectonic sample-xelatex.tex

      # platex
      - name: check platex
        run: |
          platex -halt-on-error sample-platex.tex
          dvipdfmx sample-platex.dvi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-artifact
          path: sample*.pdf

