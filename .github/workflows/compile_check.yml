# this workflow checks if the style file compiles using tectonic
name: Compile Check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Install ci tools
        run: nix profile add .#ci

      # xelatex (tectonic)
      - name: check tectonic (xelatex)
        run: tectonic sample-xelatex.tex

      # platex
      - name: check platex
        run: |
          platex -halt-on-error sample-platex.tex
          dvipdfmx sample-platex.dvi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-artifact
          path: sample*.pdf

